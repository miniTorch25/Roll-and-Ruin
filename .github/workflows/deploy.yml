name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Run game logic tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Production build
        run: npm run build
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published website and built assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          const base = new URL(process.env.PAGE_URL);
          if (!base.pathname.endsWith("/")) base.pathname += "/";

          let response;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              response = await fetch(base);
              if (response.ok) break;
            } catch {}
            if (attempt < 12) await new Promise((resolve) => setTimeout(resolve, 10000));
          }

          if (!response?.ok) {
            throw new Error(`Published page did not respond successfully: ${response?.status ?? "network error"}`);
          }

          const html = await response.text();
          if (!html.includes('id="app"') || !html.includes("ROLL")) {
            throw new Error("Published page is missing the expected Roll and Ruin app shell.");
          }

          const assetPaths = [
            ...[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map((match) => match[1]),
            ...[...html.matchAll(/<link[^>]+href=["']([^"']+\.css)["']/g)].map((match) => match[1]),
          ];

          if (assetPaths.length === 0) {
            throw new Error("No built JavaScript or CSS assets were found in the published page.");
          }

          for (const path of assetPaths) {
            const assetUrl = new URL(path, base);
            const assetResponse = await fetch(assetUrl);
            if (!assetResponse.ok) {
              throw new Error(`Published asset failed: ${assetUrl} (${assetResponse.status})`);
            }
          }

          console.log(`Website smoke test passed: ${base.href}`);
          console.log(`Verified ${assetPaths.length} built asset(s).`);
          NODE
